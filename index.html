<!doctype html>
<html lang="zh-CN" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0b0c" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta
      name="description"
      content="HONEY CITY · 蜜果城争锋频道 —— 以《明日方舟》界面设计语言为研究对象的交互式 UI 与动效样本。"
    />
    <title>HONEY CITY｜蜜果城 · 争锋频道</title>
  </head>
    <script>
      // 首屏前同步主题与动效偏好，避免刷新闪烁
      (function () {
        try {
          var raw = localStorage.getItem('honeycity.prefs.v1');
          var p = raw ? JSON.parse(raw) : {};
          var theme = p.theme === 'paper' ? 'paper' : 'dark';
          var motion = p.motion === 'reduce' || p.motion === 'full' ? p.motion : 'system';
          var reduce =
            motion === 'reduce' ||
            (motion !== 'full' && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
          var d = document.documentElement;
          d.dataset.theme = theme;
          d.dataset.reduce = reduce ? 'true' : 'false';
          d.style.colorScheme = theme === 'paper' ? 'light' : 'dark';
        } catch (e) {}
      })();
    </script>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
